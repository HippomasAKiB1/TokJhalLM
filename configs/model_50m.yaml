# TokJhalLM encoder — 50M variant (decision D2, docs/decisions.md).
# Depth 8 and head_dim 80 held fixed per PRD §6.1; only width varies across variants.
# est_params_m assumes tied embeddings, bias-free attention + SwiGLU, RMSNorm,
# and an MLM/RTD head transform (hidden×hidden). Verified by tests/test_scaffold.py.
model:
  layers: 8
  hidden: 640
  heads: 8          # head_dim 80
  ffn_hidden: 1920   # SwiGLU inner dim = 3 × hidden
  vocab_size: 12000
  context_len: 128
  tied_embeddings: true
  activation: swiglu
  norm: rmsnorm
  pos_enc: rope
  dropout: 0.1
  est_params_m: 50.7
