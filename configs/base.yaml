model:
  layers: 8
  hidden: 640
  heads: 8
  vocab_size: 12000
  context_len: 128
  tied_embeddings: true
  activation: swiglu
  norm: rmsnorm
  pos_enc: rope
  dropout: 0.1

training:
  batch_size: 2
  grad_accum: 16
  lr: 5.0e-4
  warmup_steps: 500
  weight_decay: 0.01
  optimizer: adamw_8bit
  grad_clip: 1.0
  # Fallback: if torch.cuda.is_bf16_supported() is False on target GPU 
  # (likely on GTX 1650 / Turing without Tensor Cores), set to fp16.
  # On GTX 1650 (Turing sm_75): bf16 is NOT supported (needs sm_80+). 
  # fp16 is the correct precision and uses real Tensor Cores on this GPU. 
  # The smoke test will fall back to fp16 automatically.
  precision: bf16
  gradient_checkpointing: true
  seed: 42

logging:
  wandb_project: tokjhallm
  log_every: 50
  ckpt_every: 500
  val_every: 500
