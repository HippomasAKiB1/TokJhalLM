# Phase 0 Pre-Commitment Ablation Configuration (PRD §5.0, as amended by D15)
# Sequential ablation, 3 runs total, all at 30M params (D15: the 50M arm was dropped after the
# Prompt 2 audit found only ~29M target-script tokens, 0.58 tokens/param at 50M):
# - Stage (a): 2 runs, MLM vs ELECTRA at 30M / BPE
# - Stage (b): 1 new run, BPE vs Unigram at the winning objective / 30M (BPE run reused from stage a)
# Decisions D2-D5 and D15 are recorded in docs/decisions.md.

f1_floor: 0.40  # Minimum viable macro-F1 gate on BnSentMix dev set before promoting to full pretraining

evaluation:
  metric: dev_macro_f1_per_flop
  flops_formula: 6NT   # N = all trained params incl. ELECTRA generator, T = pretraining tokens
  margin_preference: 0.5  # If within 0.5 F1 points, prefer smaller/faster model
  dataset: bnsentmix
  max_context_len: 128
  # D5 (mandatory): every candidate fine-tuned with >= 3 seeds; report mean ± std.
  # If candidates' 3-seed intervals overlap, treat as a tie → smaller/faster wins.
  finetune_seeds: [42, 43, 44]

# D4: per-run pretraining budget. 25M is the default; reset at the end of Prompt 4
# from WARM (post-10-min sustained load) throughput so that all 3 runs (D15) + all
# fine-tunes finish within max_wall_hours.
budget:
  tokens_per_run: 25000000
  max_wall_hours: 48
  throughput_basis: warm

# D2: concrete dims for each `params` label used below (standalone model configs).
model_sizes:
  30M: configs/model_30m.yaml
# D15: kept for reference and future work; not promoted unless transliteration
# massively outperforms expectations.
not_selected:
  50M: configs/model_50m.yaml

# D3: ELECTRA generator. Shares token embeddings with the discriminator.
# Only the discriminator counts toward reported params; generator FLOPs count
# toward the winning rule. ~1.25x compute vs. MLM.
electra:
  generator_layers: 2
  generator_hidden: same_as_discriminator
  share_embeddings: true
  mask_prob: 0.15
  rtd_loss_weight: 50.0

mlm:
  mask_prob: 0.15

runs:
  # Stage (a): MLM vs. ELECTRA objective at 30M params with BPE tokenizer (2 runs)
  stage_a:
    run_1_mlm_30m_bpe:
      objective: mlm
      params: 30M
      tokenizer: bpe
      vocab_size: 12000
    run_2_electra_30m_bpe:
      objective: electra
      params: 30M
      tokenizer: bpe
      vocab_size: 12000

  # Stage (b): BPE vs. Unigram at the winning objective, 30M (1 new run; BPE run reused from stage a)
  stage_b:
    reused_from_stage_a: winning_objective_30m_bpe
    run_3_winning_obj_30m_unigram:
      # objective placeholder: filled after stage (a) identifies the winner
      objective: TBD
      params: 30M
      tokenizer: unigram
      vocab_size: 12000
